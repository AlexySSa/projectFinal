<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahn | Renta de vehiculos</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/common.js"></script>
    <script defer src="/js/dashboard.js"></script>
  </head>
  <body class="page" data-page-title="app_title">
    <header class="main-header">
      <div class="main-header__inner">
        <a class="brand brand--dark" href="/">
          <span class="brand__mark">B</span>
          <span>Bahn</span>
        </a>

        <form class="search-bar search-bar--compact" data-search-form>
          <label class="search-bar__field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
            </svg>
            <input type="text" name="q" data-i18n-placeholder="search_placeholder_compact" placeholder="Busca por vehiculo, marca o modelo">
          </label>
          <label class="search-bar__field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s6-5.5 6-11a6 6 0 1 0-12 0c0 5.5 6 11 6 11Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <input type="text" name="location" data-i18n-placeholder="search_placeholder_location" placeholder="Ubicacion, ciudad o direccion">
          </label>
          <button type="submit" data-i18n="search_button">Buscar</button>
        </form>

        <div class="header-actions">
          <div data-language-slot></div>
          <a class="header-icon" href="/wishlist" data-i18n-aria-label="open_wishlist" aria-label="Ver favoritos">
            &#9825;
            <small data-wishlist-count>0</small>
          </a>
          <div class="header-user">
            <div class="header-user__avatar">&#9711;</div>
            <div class="header-user__meta">
              <strong data-user-name>Arrendador</strong>
              <span data-user-role>Arrendador</span>
              <button type="button" data-logout-btn hidden>Cerrar sesion</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero-banner">
        <div>
          <div class="pill-note" data-i18n="dashboard_badge">Panel del arrendador</div>
          <h1><span data-i18n="dashboard_hello">Hola,</span> <span id="owner-greeting">Juan Perez</span></h1>
          <p id="owner-hint">Administra tu inventario, actualiza precios y publica nuevas unidades.</p>
        </div>
        <a class="btn btn--light" href="/catalog" data-i18n="dashboard_open_catalog">Abrir catalogo</a>
      </section>

      <section class="stat-grid">
        <article class="stat-card"><span data-i18n="stat_total">Total de vehiculos</span><strong id="stat-total">0</strong></article>
        <article class="stat-card"><span data-i18n="stat_active">Publicaciones activas</span><strong id="stat-active">0</strong></article>
        <article class="stat-card"><span data-i18n="stat_average">Precio promedio</span><strong id="stat-average">$0</strong></article>
        <article class="stat-card"><span data-i18n="stat_featured">Destacados</span><strong id="stat-featured">0</strong></article>
      </section>

      <section class="dashboard-grid">
        <article class="panel panel--padded form-panel">
          <h2 id="form-title">Crear publicacion</h2>
          <form class="vehicle-form" id="vehicle-form">
            <input name="vehicleId" type="hidden">

            <div class="vehicle-form__grid">
              <input class="input" name="title" placeholder="Titulo de la publicacion" required>
              <input class="input" name="brand" placeholder="Marca" required>
              <input class="input" name="model" placeholder="Modelo" required>
              <input class="input" name="year" placeholder="Anio" type="number">
              <input class="input" name="mileage" placeholder="Kilometraje" type="number" required>
              <input class="input" name="price" placeholder="Precio" type="number" required>
              <select class="select" name="category" required>
                <option value="Heavy Machinery">Maquinaria pesada</option>
                <option value="Car">Carros</option>
                <option value="Motorcycle">Motocicletas</option>
                <option value="Agricultural">Agricola</option>
              </select>
              <select class="select" name="categoryKey" required>
                <option value="heavy">heavy</option>
                <option value="car">car</option>
                <option value="motorcycle">motorcycle</option>
                <option value="agricultural">agricultural</option>
              </select>
              <select class="select" name="priceUnit">
                <option value="day">dia</option>
                <option value="week">semana</option>
                <option value="hour">hora</option>
              </select>
              <input class="input" name="location" placeholder="Ubicacion" required>
              <select class="select" name="visualCondition">
                <option value="Excellent">Excelente</option>
                <option value="Good">Bueno</option>
                <option value="Regular">Regular</option>
              </select>
              <select class="select" name="mechanicalCondition">
                <option value="Optimal">Optimo</option>
                <option value="Good">Bueno</option>
                <option value="Requires Review">Requiere revision</option>
              </select>
              <input class="input" name="contactPhone" placeholder="Telefono de contacto" required>
              <input class="input" name="contactWhatsapp" placeholder="WhatsApp">
              <input class="input" name="thumbnail" placeholder="URL de miniatura (opcional)">
              <input class="input" name="heroImage" placeholder="URL de portada (opcional)">
            </div>
            <textarea class="textarea" name="description" placeholder="Descripcion" rows="5"></textarea>

            <div class="action-row">
              <button class="btn btn--primary" type="submit" id="dashboard-submit">Guardar publicacion</button>
              <button class="btn btn--ghost hidden" id="cancel-edit" type="button">Cancelar edicion</button>
            </div>
            <div class="form-status" id="dashboard-status"></div>
          </form>
        </article>

        <article class="panel panel--padded inventory-panel">
          <h2 data-i18n="inventory_title">Inventario</h2>
          <div class="inventory-list" id="inventory-list"></div>
        </article>
      </section>
    </main>
  </body>
</html>
