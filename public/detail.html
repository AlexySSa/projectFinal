<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahn | Renta de vehiculos</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/common.js"></script>
    <script defer src="/js/detail.js"></script>
  </head>
  <body class="page" data-page-title="app_title">
    <header class="main-header">
      <div class="main-header__inner">
        <a class="brand brand--dark" href="/">
          <span class="brand__mark">B</span>
          <span>Bahn</span>
        </a>

        <form class="search-bar search-bar--compact" data-search-form>
          <label class="search-bar__field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
            </svg>
            <input type="text" name="q" data-i18n-placeholder="search_placeholder_compact" placeholder="Busca por vehiculo, marca o modelo">
          </label>
          <label class="search-bar__field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s6-5.5 6-11a6 6 0 1 0-12 0c0 5.5 6 11 6 11Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <input type="text" name="location" data-i18n-placeholder="search_placeholder_location" placeholder="Ubicacion, ciudad o direccion">
          </label>
          <button type="submit" data-i18n="search_button">Buscar</button>
        </form>

        <div class="header-actions">
          <div data-language-slot></div>
          <a class="header-icon" href="/wishlist" data-i18n-aria-label="open_wishlist" aria-label="Ver favoritos">
            &#9825;
            <small data-wishlist-count>0</small>
          </a>
          <div class="header-user">
            <div class="header-user__avatar">&#9711;</div>
            <div class="header-user__meta">
              <strong data-user-name>Usuario / Menu</strong>
              <span data-user-role>Invitado</span>
              <button type="button" data-logout-btn hidden>Cerrar sesion</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-shell" id="detail-shell">
      <section class="detail-layout">
        <div class="panel detail-gallery">
          <div class="detail-gallery__main">
            <img id="detail-main-image" src="https://images.unsplash.com/photo-1751054619908-65d27a503ce8?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=60&w=2200" alt="Vehiculo">
          </div>
          <div class="thumb-strip" id="detail-thumbs"></div>
        </div>

        <aside class="panel detail-card">
          <h1 id="detail-title">Excavadora Caterpillar 320D</h1>
          <div class="detail-price" id="detail-price">$235 / dia</div>
          <div class="detail-location" id="detail-location">Ubicacion: Zona industrial, San Salvador</div>

          <div class="stack-actions">
            <button class="btn btn--ghost" id="detail-wishlist" type="button">Agregar a favoritos</button>
            <button class="btn btn--primary" id="detail-contact-owner" type="button">Contactar arrendador</button>
            <div class="action-row">
              <button class="icon-button icon-button--mail" id="detail-mail" type="button">&#9993;</button>
              <button class="icon-button icon-button--phone" id="detail-phone" type="button">&#9742;</button>
              <button class="icon-button icon-button--whatsapp" id="detail-whatsapp" type="button">WA</button>
            </div>
          </div>
        </aside>
      </section>

      <section class="detail-columns">
        <article class="panel panel--padded">
          <div class="section-heading">
            <h3 data-i18n="detail_specs">Especificaciones</h3>
          </div>
          <dl class="spec-list" id="detail-specs"></dl>
        </article>

        <article class="panel panel--padded">
          <div class="section-heading">
            <h3 data-i18n="detail_description">Descripcion</h3>
          </div>
          <p class="muted" id="detail-description"></p>
        </article>

        <article class="panel panel--padded">
          <div class="section-heading">
            <h3 data-i18n="detail_map">Mapa</h3>
          </div>
          <div class="map-box">
            <img src="/assets/vehicles/map-grid.svg" alt="Mapa">
          </div>
        </article>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <div>
            <h2 data-i18n="detail_related">Vehiculos relacionados</h2>
            <p data-i18n="detail_related_desc">Otras unidades parecidas que tambien estan disponibles.</p>
          </div>
        </div>
        <div class="listing-grid" id="related-listings"></div>
      </section>
    </main>
  </body>
</html>
