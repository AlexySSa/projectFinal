<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahn | Renta de vehiculos</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/common.js"></script>
    <script defer src="/js/catalog.js"></script>
  </head>
  <body class="page" data-page-title="app_title">
    <header class="main-header">
      <div class="main-header__inner">
        <a class="brand brand--dark" href="/">
          <span class="brand__mark">B</span>
          <span>Bahn</span>
        </a>

        <form class="search-bar search-bar--compact" data-search-form>
          <label class="search-bar__field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20l-4-4"></path>
            </svg>
            <input id="catalog-search" type="text" name="q" data-i18n-placeholder="search_placeholder_compact" placeholder="Busca por vehiculo, marca o modelo">
          </label>
          <label class="search-bar__field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s6-5.5 6-11a6 6 0 1 0-12 0c0 5.5 6 11 6 11Z"></path>
              <circle cx="12" cy="10" r="2.5"></circle>
            </svg>
            <input id="catalog-location" type="text" name="location" data-i18n-placeholder="search_placeholder_location" placeholder="Ubicacion, ciudad o direccion">
          </label>
          <button type="submit" data-i18n="search_button">Buscar</button>
        </form>

        <div class="header-actions">
          <div data-language-slot></div>
          <a class="header-icon" href="/wishlist" data-i18n-aria-label="open_wishlist" aria-label="Ver favoritos">
            &#9825;
            <small data-wishlist-count>0</small>
          </a>
          <div class="header-user">
            <div class="header-user__avatar">&#9711;</div>
            <div class="header-user__meta">
              <strong data-user-name>Usuario / Menu</strong>
              <span data-user-role>Invitado</span>
              <button type="button" data-logout-btn hidden>Cerrar sesion</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <div class="catalog-layout">
        <aside class="panel filters-panel">
          <h2 data-i18n="filters_title">Filtros</h2>

          <div class="filter-group">
            <label class="filter-label" data-i18n="filter_category">Categoria</label>
            <div class="radio-stack">
              <label class="radio-item"><input checked name="category" type="radio" value=""> <span data-i18n="category_all">Todos</span></label>
              <label class="radio-item"><input name="category" type="radio" value="car"> <span data-i18n="category_car">Carros</span></label>
              <label class="radio-item"><input name="category" type="radio" value="motorcycle"> <span data-i18n="category_motorcycle">Motocicletas</span></label>
              <label class="radio-item"><input name="category" type="radio" value="heavy"> <span data-i18n="category_heavy">Maquinaria pesada</span></label>
              <label class="radio-item"><input name="category" type="radio" value="agricultural"> <span data-i18n="category_agricultural">Agricola</span></label>
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="make-filter" data-i18n="filter_make">Marca</label>
            <select class="select" id="make-filter"></select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="model-filter" data-i18n="filter_model">Modelo</label>
            <select class="select" id="model-filter"></select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="price-filter" data-i18n="filter_price">Rango de precio</label>
            <div class="range-wrap">
              <input id="price-filter" max="300" min="20" step="5" type="range" value="300">
              <div class="range-row">
                <span id="price-min">$20</span>
                <span id="price-value">$300</span>
              </div>
            </div>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="location-filter" data-i18n="filter_location">Ubicacion</label>
            <select class="select" id="location-filter"></select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="condition-filter" data-i18n="filter_condition">Condicion</label>
            <select class="select" id="condition-filter">
              <option value="" data-i18n="filter_any">Cualquiera</option>
              <option value="excellent" data-i18n="condition_excellent">Excelente</option>
              <option value="good" data-i18n="condition_good">Bueno</option>
              <option value="optimal" data-i18n="condition_optimal">Optimo</option>
            </select>
          </div>
        </aside>

        <section class="catalog-main panel">
          <div class="toolbar">
            <div class="toolbar__title">
              <h2 data-i18n="toolbar_title">Resultados disponibles</h2>
              <p id="catalog-count">0 publicaciones</p>
            </div>
            <div class="sort-pills">
              <span class="sort-pills__label" data-i18n="sort_by">Ordenar por:</span>
              <button class="is-active" data-sort="featured" type="button" data-i18n="sort_featured">Destacados</button>
              <button data-sort="price" type="button" data-i18n="sort_price">Precio</button>
              <button data-sort="date" type="button" data-i18n="sort_date">Fecha</button>
            </div>
          </div>
          <div class="catalog-main__body">
            <div class="listing-grid" id="catalog-list"></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
