<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahn | Renta de vehiculos</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/common.js"></script>
    <script defer src="/js/auth.js"></script>
  </head>
  <body class="page page-auth" data-page-title="app_title">
    <main class="auth-shell">
      <section class="auth-layout">
        <div class="auth-scene">
          <div class="auth-scene__inner">
            <div>
              <a class="brand brand--dark" href="/">
                <span class="brand__mark">B</span>
                <span>Bahn</span>
              </a>
              <div class="auth-scene__copy">
                <h1 id="auth-scene-title" data-i18n="auth_scene_title">Conecta</h1>
                <p id="auth-scene-copy" data-i18n="auth_scene_subtitle">Conecta con vehiculos, motos y maquinaria real</p>
              </div>
            </div>
            <div class="auth-scene__footer" data-i18n="auth_scene_subtitle">Conecta con vehiculos, motos y maquinaria real</div>
          </div>
        </div>

        <div class="auth-panel">
          <section class="auth-card">
            <div class="auth-card__top">
              <div class="pill-toggle">
                <button type="button" data-auth-mode="login">Entrar</button>
                <button type="button" data-auth-mode="register" class="is-active">Registrarse</button>
              </div>
              <div data-language-slot></div>
            </div>

            <h2 id="auth-title">Crear cuenta</h2>
            <p id="auth-description">Crea tu cuenta y elige si quieres publicar vehiculos o explorar el catalogo.</p>

            <form class="auth-form" id="auth-form">
              <div class="auth-form__row" data-register-only>
                <label for="name" id="label-name">Nombre completo</label>
                <input class="input" id="name" name="name" placeholder="Nombre completo">
              </div>

              <div class="auth-form__row">
                <label for="email" id="label-email">Correo electronico</label>
                <input class="input" id="email" name="email" placeholder="Correo electronico" type="email" required>
              </div>

              <div class="auth-form__row">
                <label for="password" id="label-password">Contrasena</label>
                <div class="password-field">
                  <input class="input" id="password" name="password" placeholder="Contrasena" type="password" required>
                  <button type="button" id="toggle-password">Mostrar</button>
                </div>
              </div>

              <div class="auth-form__row" data-register-only>
                <label for="phone" id="label-phone">Numero de telefono</label>
                <input class="input" id="phone" name="phone" placeholder="Numero de telefono">
              </div>

              <div class="auth-form__row" data-register-only>
                <label for="role" id="label-role">Selecciona tu rol</label>
                <select class="select" id="role" name="role">
                  <option value="owner">Arrendador</option>
                  <option value="client">Cliente</option>
                </select>
              </div>

              <button class="btn btn--primary" id="auth-submit" type="submit">Crear cuenta</button>
              <div class="form-status" id="auth-status"></div>
            </form>

            <div class="demo-note" id="auth-demo-note">
              Demo arrendador: <strong>owner@bahn.com</strong> / <strong>123456</strong><br>
              Demo cliente: <strong>client@bahn.com</strong> / <strong>123456</strong>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
